version: 2
updates:
- package-ecosystem: uv
  directory: "/"
  groups:
    uv:
      patterns:
        - "*"
  schedule:
    interval: quarterly
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: "/"
  groups:
    github-actions:
      patterns:
        - "*"
  schedule:
    interval: quarterly
  cooldown:
    default-days: 7
- package-ecosystem: docker
  directory: "/"
  groups:
    docker:
      patterns:
        - "*"
  schedule:
    interval: quarterly
  cooldown:
    default-days: 7
